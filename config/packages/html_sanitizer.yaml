framework:
    html_sanitizer:
        sanitizers:
            # Règlement d'une saison (App\Reglement\EditionReglement, D55 à D57) : mise en forme de l'éditeur seulement ;
            # images du site uniquement (adresses relatives), liens http, https et mailto. Les codes courts sont du texte.
            # Attribut class : seulement les classes de l'éditeur (App\Reglement\ClasseAlignement, alignements).
            app.reglement:
                with_attribute_sanitizers:
                    - App\Reglement\ClasseAlignement
                allow_elements:
                    h2: [class]
                    h3: [class]
                    h4: [class]
                    p: [class]
                    br: []
                    hr: []
                    strong: []
                    b: []
                    em: []
                    i: []
                    u: []
                    s: []
                    mark: []
                    sub: []
                    sup: []
                    code: []
                    blockquote: []
                    ul: []
                    ol: [start]
                    li: []
                    a: [href, title]
                    img: [src, alt, width, height, class]
                    table: []
                    thead: []
                    tbody: []
                    tr: []
                    th: [colspan, rowspan]
                    td: [colspan, rowspan]
                allowed_link_schemes: [http, https, mailto]
                allow_relative_links: true
                allowed_media_schemes: []
                allowed_media_hosts: []
                allow_relative_medias: true
                max_input_length: 500000 # = EditionReglement::TAILLE_MAX
            # Description d'un club (App\Service\DescriptionClub, D63) : barre réduite de l'éditeur de la fiche, écrite par
            # les responsables de club ; ni image, ni tableau, ni attribut class ou style ; liens http, https et mailto.
            app.club:
                allow_elements:
                    h3: []
                    h4: []
                    p: []
                    br: []
                    strong: []
                    b: []
                    em: []
                    i: []
                    ul: []
                    ol: []
                    li: []
                    a: [href]
                # Liens écrits par des non-admins vers des sites tiers : pas de transmission de l'adresse de la page ni
                # de référencement
                force_attributes:
                    a: { rel: 'noopener noreferrer nofollow ugc' }
                # Balises de mise en forme retirées sans perdre leur texte (titre h2 collé, citation…) ; les autres
                # (script, style, iframe, image, tableau…) disparaissent avec leur contenu
                block_elements: [h1, h2, h5, h6, div, span, section, article, blockquote, pre, code, u, s, mark, sub, sup, small]
                allowed_link_schemes: [http, https, mailto]
                allow_relative_links: false
                allowed_media_schemes: []
                allow_relative_medias: false
                # Protection contre un envoi démesuré, bien au-delà de la limite de Club::description (Assert\Length, 20000) :
                # le sanitizer coupe sans prévenir, la validation doit se déclencher avant
                max_input_length: 100000
