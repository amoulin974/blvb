framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Compteurs d'essais de connexion (LimiteurConnexion) : à part, pour qu'un vidage de cache.app par l'application
            # ne les efface pas. Stockés dans var/cache : cache:clear et donc un déploiement les remettent à zéro.
            connexions.cache: null

# Tests : cache en mémoire, vidé à chaque requête (les données de test sont annulées après chaque test,
# un cache sur disque garderait des saisons qui n'existent plus)
when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                # Sur disque : un cache en mémoire serait vidé entre deux essais de connexion (vidé avant chaque test, voir TestFonctionnel)
                connexions.cache:
                    adapter: cache.adapter.filesystem
