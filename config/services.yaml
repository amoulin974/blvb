# This file configures your own services

parameters:
    # Images des clubs (logos) envoyées depuis la fiche du club : servies par asset('uploads/clubs/…').
    # En prod, le dossier de l'application est monté depuis le serveur : les images survivent aux reconstructions.
    app.dossier_images_clubs: '%kernel.project_dir%/public/uploads/clubs'
# La structure d'une saison (phases, poules) ne vient plus de config/app/saison.yaml mais des modèles de saison
# (App\Competition\Modele, docs/wizard-saison/decisions.md D6 et D10)

services:
    # Valeurs par défaut pour tous les services
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    App\Command\:
        resource: '../src/Command/'
    App\DataFixtures\:
        resource: '../src/DataFixtures/'

    App\Story\:
        resource: '../src/Story/'

    App\Factory\:
        resource: '../src/Factory/'
    # --------------------------------------------------------
    # Services normaux
    App\Service\:
        resource: '../src/Service/'

    # Règles propres à chaque sport (docs/wizard-saison/plan.md)
    App\Competition\Sport\:
        resource: '../src/Competition/Sport/'

    # Générateurs de calendrier, un par format de compétition (docs/wizard-saison/plan.md)
    App\Competition\Format\:
        resource: '../src/Competition/Format/'

    # Copie d'une saison, point de départ du wizard (D10, D22)
    App\Competition\CopieSaison: ~

    # Composition des poules d'une phase, étape « Poules » de la mise en place (D35 à D38)
    App\Competition\CompositionPoules: ~

    # Journées d'une phase, étape « Journées » de la mise en place (D35 à D39)
    App\Competition\MiseEnPlaceJournees: ~

    # Matchs d'une phase, étape « Matchs » de la mise en place (D35 à D40)
    App\Competition\MiseEnPlaceMatchs: ~

    # Modèles de saison, point de départ du wizard (docs/wizard-saison/decisions.md, D10)
    App\Competition\Modele\:
        resource: '../src/Competition/Modele/'

    # --------------------------------------------------------
    # Contrôleurs
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # --------------------------------------------------------
    # Security
    App\Security\:
        resource: '../src/Security/'

    # --------------------------------------------------------
    # Extensions Twig
    App\Twig\:
        resource: '../src/Twig/'

    # --------------------------------------------------------
    # Repositories Doctrine
    App\Repository\:
        resource: '../src/Repository/'
        tags: ['doctrine.repository_service']

# Tests : images écrites hors de public/, dans var/
when@test:
    parameters:
        app.dossier_images_clubs: '%kernel.project_dir%/var/test/uploads/clubs'
