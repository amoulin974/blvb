# This file configures your own services

parameters:
    # Images des clubs (logos) envoyées depuis la fiche du club : servies par asset('uploads/clubs/…').
    # En prod, le dossier de l'application est monté depuis le serveur : les images survivent aux reconstructions.
    app.dossier_images_clubs: '%kernel.project_dir%/public/uploads/clubs'
# Ici tu peux importer ton fichier de config YAML
# ou définir directement les paramètres
# Exemple pour la config des phases/poules
imports:
    - { resource: app/saison.yaml }

services:
    # Valeurs par défaut pour tous les services
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    App\Command\:
        resource: '../src/Command/'
    App\DataFixtures\:
        resource: '../src/DataFixtures/'

    App\Story\:
        resource: '../src/Story/'

    App\Factory\:
        resource: '../src/Factory/'
    # --------------------------------------------------------
    # Services normaux
    App\Service\:
        resource: '../src/Service/'

    # --------------------------------------------------------
    # Contrôleurs
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # --------------------------------------------------------
    # Security
    App\Security\:
        resource: '../src/Security/'

    # --------------------------------------------------------
    # Extensions Twig
    App\Twig\:
        resource: '../src/Twig/'

    # --------------------------------------------------------
    # Subscriber Doctrine pour créer automatiquement les phases/poules
    App\EventListener\SaisonListener:
        autowire: true
        autoconfigure: false  # on configure manuellement
        public: true          # nécessaire pour éviter l'inlining
        tags:
            - name: doctrine.event_listener
              event: 'postPersist'
              priority: 500
              connection: 'default'

    # --------------------------------------------------------
    # Repositories Doctrine
    App\Repository\:
        resource: '../src/Repository/'
        tags: ['doctrine.repository_service']

# Tests : images écrites hors de public/, dans var/
when@test:
    parameters:
        app.dossier_images_clubs: '%kernel.project_dir%/var/test/uploads/clubs'
